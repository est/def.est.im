<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>def.est.im</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar">
  <a class="brand" href="/">def.est.im</a>
  <div class="search-bar">
    <input type="text" placeholder="搜索…" id="q" autofocus>
    <kbd>⌘K</kbd>
  </div>
</div>

<div class="hero">
  <h1>def.est.im</h1>
  <p class="sub">
    不限格式：变形词、词组、搭配、人名地名都可以。
    输入 <a href="/run">run</a>、
    <a href="/went">went</a>、
    <a href="/run%20into">run into</a>、
    <a href="/heavy%20rain">heavy rain</a>、
    <a href="/karen">Karen</a> 试试。
  </p>
</div>

<script>
var q = document.getElementById('q');
document.addEventListener('keydown', function(e) {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault(); q.focus(); q.select();
  }
});
q.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && this.value.trim()) {
    location.href = '/' + encodeURIComponent(this.value.trim());
  }
});
</script>
</body>
</html>
